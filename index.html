
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#166534">
  <title>TaniCam AI - Asisten Tanaman</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f0fdf4;
      color: #17351f;
      line-height: 1.6;
    }
    header {
      background: #166534;
      color: white;
      padding: 24px 18px;
      text-align: center;
    }
    header h1 { margin: 0 0 8px; font-size: 30px; }
    header p { margin: 0; }
    main {
      max-width: 600px;
      margin: 22px auto;
      padding: 0 15px 30px;
    }
    .card {
      background: white;
      border-radius: 20px;
      padding: 22px;
      margin-bottom: 18px;
      box-shadow: 0 5px 20px #14532d12;
    }
    h2 { margin-top: 0; font-size: 23px; }
    label {
      display: block;
      font-weight: bold;
      margin: 15px 0 8px;
    }
    input[type="file"] {
      display: block;
      width: 100%;
      margin: 10px 0 16px;
      font-size: 14px;
    }
    #preview {
      display: none;
      width: 100%;
      max-height: 350px;
      object-fit: contain;
      border-radius: 12px;
      margin: 12px 0;
      background: #f3f4f6;
    }
    button {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 10px;
      background: #15803d;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled { opacity: .6; }
    #status { font-size: 14px; color: #52645a; }
    #result {
      overflow-wrap: anywhere;
      font-size: 15px;
    }
    #result h3 {
      color: #166534;
      font-size: 17px;
      margin: 20px 0 8px;
    }
    #result p { margin: 8px 0; }
    #result ul { padding-left: 22px; }
    .note { color: #64748b; font-size: 13px; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <header>
    <h1>TaniCam AI</h1>
    <p>Asisten cerdas untuk membantu memeriksa kondisi tanaman.</p>
  </header>

  <main>
    <section class="card">
      <h2>Periksa Tanaman</h2>
      <p>Pilih foto daun atau tanaman yang ingin diperiksa.</p>

      <label for="image">Foto tanaman</label>
      <input
        id="image"
        type="file"
        accept="image/jpeg,image/png,image/webp"
        capture="environment"
      >

      <img id="preview" alt="Pratinjau foto tanaman">

      <button id="analyze" type="button">Analisis Tanaman</button>
      <p id="status" role="status" aria-live="polite"></p>
      <p class="note">
        Gunakan foto yang jelas. Hasil AI adalah dugaan awal,
        bukan diagnosis pasti.
      </p>
    </section>

    <section class="card" id="resultCard" hidden>
      <h2>Hasil Analisis</h2>
      <div id="result"></div>
    </section>
  </main>

  <script>
    const API_URL = "https://tani-cam-ai.onrender.com/analyze";
    const imageInput = document.getElementById("image");
    const preview = document.getElementById("preview");
    const button = document.getElementById("analyze");
    const status = document.getElementById("status");
    const resultCard = document.getElementById("resultCard");
    const result = document.getElementById("result");

    imageInput.addEventListener("change", () => {
      const file = imageInput.files[0];
      preview.style.display = file ? "block" : "none";
      if (file) {
        preview.src = URL.createObjectURL(file);
        status.textContent = "";
      }
    });

    function showAnalysis(text) {
      const safe = text.replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");

      const lines = safe.split(/\r?\n/);
      result.innerHTML = "";

      lines.forEach(line => {
        let value = line.trim();
        if (!value) return;

        value = value
          .replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>")
          .replace(/\*(.*?)\*/g, "<em>$1</em>");

        const heading = value.match(
          /^\**\s*\d+\.\s*(.*?)\**$/
        );

        if (heading && !value.includes(":**")) {
          const h = document.createElement("h3");
          h.innerHTML = value.replace(
            /^\**\s*\d+\.\s*/,
            ""
          ).replace(/\**$/, "");
          result.appendChild(h);
        } else {
          const p = document.createElement("p");
          p.innerHTML = value
            .replace(/^\*\s*/, "• ")
            .replace(/^\-\s*/, "• ");
          result.appendChild(p);
        }
      });
    }

    button.addEventListener("click", async () => {
      const file = imageInput.files[0];

      if (!file) {
        status.textContent = "Pilih foto tanaman terlebih dahulu.";
        return;
      }

      if (file.size > 10 * 1024 * 1024) {
        status.textContent = "Ukuran foto maksimal 10 MB.";
        return;
      }

      button.disabled = true;
      button.textContent = "Sedang Menganalisis...";
      status.textContent = "Foto sedang diperiksa oleh AI...";
      resultCard.hidden = true;

      try {
        const formData = new FormData();
        formData.append("image", file);

        const response = await fetch(API_URL, {
          method: "POST",
          body: formData
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(
            data.detail || "Analisis gagal. Silakan coba lagi."
          );
        }

        if (!data.analysis) {
          throw new Error("AI belum memberikan hasil.");
        }

        showAnalysis(data.analysis);
        resultCard.hidden = false;
        status.textContent = "Analisis selesai.";
      } catch (error) {
        status.textContent =
          error.message || "Koneksi gagal. Coba lagi.";
      } finally {
        button.disabled = false;
        button.textContent = "Analisis Tanaman";
      }
    });
  </script>
</body>
</html>
